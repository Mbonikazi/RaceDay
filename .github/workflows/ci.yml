name: RaceDay API CI/CD

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Show repository structure (debug)
        run: |
          echo "=== Root files ==="
          ls -la
          echo ""
          echo "=== Solution files ==="
          find . -name "*.sln" -maxdepth 2
          echo ""
          echo "=== Project files ==="
          find . -name "*.csproj" -maxdepth 3

      - name: Restore packages
        run: dotnet restore RaceDay.sln

      - name: Build solution
        run: dotnet build RaceDay.sln --no-restore --configuration Release /p:TreatWarningsAsErrors=false /p:WarningsAsErrors=

      - name: Run unit tests
        run: dotnet test RaceDay.sln --no-build --configuration Release --verbosity normal
