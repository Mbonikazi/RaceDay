name: RaceDay API CI/CD

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Show repository contents
        run: |
          echo "=== Root directory ==="
          ls -la
          echo ""
          echo "=== Solution files found ==="
          find . -name "*.sln" -not -path "./.git/*"
          echo ""
          echo "=== Project files found ==="
          find . -name "*.csproj" -not -path "./.git/*"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build --no-restore --configuration Release -p:TreatWarningsAsErrors=false -p:WarningsAsErrors= -p:Nullable=disable

      - name: Run tests
        run: dotnet test --no-build --configuration Release --verbosity normal
